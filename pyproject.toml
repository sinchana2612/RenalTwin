[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renaltwin"
version = "0.1.0"
description = "Research prototype for a longitudinal kidney-health digital twin"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3", "PyYAML>=6", "fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "pydantic>=2.6", "httpx>=0.27", "plotly>=5.18", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]
dashboard = ["streamlit>=1.32"]
real = ["ucimlrepo>=0.0.7"]

[project.scripts]
renaltwin = "renaltwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
